name: Release

# A pushed tag that is a bare version ("1.3.0", never "v1.3.0") runs the lint and the tests, builds
# the module zip and publishes the GitHub release Foundry installs from. The tag must equal
# module.json's version and the last path segment of its `download` URL, and module.json is committed
# BEFORE the tag: the step below refuses a tag that disagrees with it, since a release whose zip says
# one version and whose URL says another is one Foundry will not update to.
#
# The checks run HERE and not only in CI: the tag and the push to main go up together, and the
# release finished before CI had installed, so a red CI would have shown only after
# `releases/latest/download/module.json` already served the new version.
#
# The actions are pinned to a commit, with the tag it was at in the comment: this job may write a
# release every install's update check reads, and a tag like `v2` can be moved under it.
on:
  push:
    tags:
      - "[0-9]*"

# This one writes: the release and its two files. Nothing else.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Check the tag against module.json
        run: |
          version=$(node -p "require('./module.json').version")
          download=$(node -p "require('./module.json').download")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "module.json says $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi
          case "$download" in
            */releases/download/"$GITHUB_REF_NAME"/module.zip) ;;
            *) echo "module.json's download is $download, which is not this tag's"; exit 1 ;;
          esac

      # Exactly the nine root items the 1.2.2 zip held. Nothing from node_modules, tests, docs or the
      # configs: the README's pictures under docs/ are absent from the zip, which Foundry never shows.
      - name: Zip the module
        run: zip -r module.zip module.json relationship-map.js module styles templates languages LICENSE README.md CHANGELOG.md

      # The notes are the changelog's own section for this version, from its "## <tag>" heading to the
      # next "## ". An empty cut (a tag with no section) still releases, with a pointer instead.
      - name: Cut the release notes from the changelog
        run: |
          awk -v tag="$GITHUB_REF_NAME" '$0 == "## " tag { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi

      # Neither draft nor prerelease, or `releases/latest/download/module.json` skips it and Foundry
      # never sees the new version.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            module.zip
            module.json
          body_path: notes.md
          draft: false
          prerelease: false
