name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So a run can be repeated against a branch without an empty commit to trigger it.
  workflow_dispatch:

# Cancel a run that a newer push to the SAME ref has already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the tree.
#
# It must NEVER be switched to `pull_request_target`. That trigger runs with a writable token and the
# base repo's secrets while checking out a fork's code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test
